<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
       content="width=device-width, initial-scale=1.0">
  <title>Form Pendaftaran Mahasiswa</title>
  <link rel="stylesheet"
       href="css_pesan/style.css">
</head>
<body>
  <main class="container">
     <section class="registration-card">
        <div class="form-header">
           <span class="label">
             Form
           </span>
           <h1>
              Pesan Makanan
           </h1>
           <p>
              Silakan isi pilihan makanan Anda.
           </p>
        </div>
        <!--
           Method POST digunakan karena
           data pendaftaran dikirim melalui
           body HTTP request.
        -->
        <form
           action="/proses-pendaftaran"
           method="post">
           <!-- Nama -->
           <div class="form-group">
              <label for="nama">
                 Nama Pelanggan
              </label>
              <input
                 type="text"
                 id="nama"
                 name="nama"
                 placeholder="Masukkan nama lengkap"
                 required>
           </div>
           <!-- Email -->
           <div class="form-group">
              <label for="email">
                 Email Pelanggan
              </label>
              <input
                 type="email"
                 id="email"
                 name="email"
                 placeholder="nama@email.com"
                 required>
           </div>
           <!-- Password -->
           <div class="form-group">
              <label for="password">
                 No Telepon
              </label>
              <input
                 type="password"
                 id="password"
                 name="password"
                 placeholder="Masukkan No Telepon"
                 required>
           </div>
           <!-- Umur -->
           <div class="form-group">
              <label for="umur">
                 Menu Pilihan
              </label>
              <select
                 id="program-studi"
                 name="program_studi"
                 required>
                 <option value="">
                    -- Pilih Menu Makanan --
                 </option>
                 <option value="informatika">
                    Rendang
                 </option>
                 <option value="mesin">
                    Tunjang
                 </option>
                 <option value="elektro">
                    Dendeng Batokok
                 </option>
                 <option value="sipil">
                    Ayam Bakar
                 </option>
              </select>
           </div>
           <!-- Metode Pembayaran -->
           <div class="form-group">
              <label for="program-studi">
                 Metode Pembayaran
              </label>
              <select
                 id="program-studi"
                 name="program_studi"
                 required>
                 <option value="">
                    -- Pilih Metode Pembayaran --
                 </option>
                 <option value="informatika">
                    Cash
                 </option>
                 <option value="mesin">
                    Debit
                 </option>
                 <option value="elektro">
                    Qris
                 </option>
              </select>
           </div>
           <!-- Alamat -->
           <div class="form-group">
              <label for="alamat">
                 Catatan Tambahan
              </label>
              <textarea
                 id="alamat"
                 name="alamat"
                 rows="5"
                 placeholder="Contoh: Gula Sedikit">
              </textarea>
           </div>
           <!-- Button -->
           <div class="button-group">
              <button
                 type="submit"
                 class="btn btn-primary">
                 Kirim
              </button>
              <button
                 type="reset"
                 class="btn btn-reset">
                 Reset
              </button>
              <button
                 type="button"
                 class="btn btn-secondary">
                 Kembali
              </button>
           </div>
        </form>
     </section>
  </main>
</body>
</html>

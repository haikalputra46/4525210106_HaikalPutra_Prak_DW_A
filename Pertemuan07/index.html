<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Form Registrasi Event</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="container">
    <section class="registration-card">
      <div class="form-header">
        <span class="label">REGISTRASI EVENT</span>
        <h1>Seminar Teknologi Kampus 2026</h1>
        <p>Silakan lengkapi data berikut dengan benar.</p>
      </div>

      <!--
        novalidate: pesan error ditampilkan oleh script.js agar seragam.
        enctype multipart/form-data: wajib karena ada upload file.
        Validasi di sini hanya untuk kenyamanan pengguna, server tetap
        harus memvalidasi ulang.
      -->
      <form id="form-event" action="/proses-registrasi" method="post"
            enctype="multipart/form-data" novalidate>

        <!-- Nama -->
        <div class="form-group">
          <label for="nama">Nama Lengkap</label>
          <input type="text" id="nama" name="nama" placeholder="Masukkan nama lengkap"
                 minlength="3" maxlength="60" required>
          <small class="error" id="error-nama"></small>
        </div>

        <!-- Email -->
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="nama@email.com" required>
          <small class="error" id="error-email"></small>
        </div>

        <!-- No HP -->
        <div class="form-group">
          <label for="hp">Nomor HP</label>
          <input type="tel" id="hp" name="hp" placeholder="08xxxxxxxxxx"
                 inputmode="numeric" required>
          <small class="hint">Awali dengan 08, panjang 10–13 digit.</small>
          <small class="error" id="error-hp"></small>
        </div>

        <!-- Radio: jenis peserta -->
        <fieldset class="form-group" id="grup-peserta">
          <legend>Jenis Peserta</legend>
          <label class="option"><input type="radio" name="peserta" value="mahasiswa"> Mahasiswa</label>
          <label class="option"><input type="radio" name="peserta" value="umum"> Umum</label>
          <label class="option"><input type="radio" name="peserta" value="alumni"> Alumni</label>
          <small class="error" id="error-peserta"></small>
        </fieldset>

        <!-- Select: kota -->
        <div class="form-group">
          <label for="kota">Kota Asal</label>
          <select id="kota" name="kota" required>
            <option value="">-- Pilih Kota --</option>
            <option value="jakarta">Jakarta</option>
            <option value="bandung">Bandung</option>
            <option value="surabaya">Surabaya</option>
            <option value="yogyakarta">Yogyakarta</option>
          </select>
          <small class="error" id="error-kota"></small>
        </div>

        <!-- Checkbox: sesi -->
        <fieldset class="form-group" id="grup-sesi">
          <legend>Sesi yang Diikuti (pilih minimal 1)</legend>
          <label class="option"><input type="checkbox" name="sesi" value="ai"> Workshop AI</label>
          <label class="option"><input type="checkbox" name="sesi" value="web"> Workshop Web</label>
          <label class="option"><input type="checkbox" name="sesi" value="keamanan"> Talkshow Keamanan Siber</label>
          <small class="error" id="error-sesi"></small>
        </fieldset>

        <!-- Textarea -->
        <div class="form-group">
          <label for="alasan">Alasan Mengikuti Event</label>
          <textarea id="alasan" name="alasan" rows="5" maxlength="300"
                    placeholder="Minimal 20 karakter"></textarea>
          <small class="hint"><span id="hitung">0</span>/300 karakter</small>
          <small class="error" id="error-alasan"></small>
        </div>

        <!-- Upload -->
        <div class="form-group">
          <label for="bukti">Bukti Pembayaran</label>
          <input type="file" id="bukti" name="bukti" accept=".jpg,.jpeg,.png,.pdf">
          <small class="hint">Format JPG, PNG, atau PDF. Maksimal 2 MB.</small>
          <small class="error" id="error-bukti"></small>
        </div>

        <!-- Persetujuan -->
        <div class="form-group">
          <label class="option">
            <input type="checkbox" name="setuju" id="setuju" value="ya">
            Saya menyatakan data di atas benar.
          </label>
          <small class="error" id="error-setuju"></small>
        </div>

        <div class="button-group">
          <button type="submit" class="btn btn-primary">Daftar</button>
          <button type="reset" class="btn btn-reset">Reset</button>
          <button type="button" class="btn btn-secondary">Kembali</button>
        </div>
        <p class="status" id="status" role="status"></p>
      </form>
    </section>
  </main>
  <script src="js/validasi.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
